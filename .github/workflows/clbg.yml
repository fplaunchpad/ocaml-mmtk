name: CLBG correctness

# Runs the CLBG benchmark suite as a cross-plan GC-correctness check: every
# program must produce byte-identical output under every MMTk plan. (Performance
# measurement is a separate manual job — see benchmarks/clbg/README.md.)

on:
  push:
    paths:
      - 'benchmarks/clbg/**'
      - 'gc/mmtk/**'
      - 'runtime/**'
      - '.github/workflows/clbg.yml'
  pull_request:
    paths:
      - 'benchmarks/clbg/**'
      - 'gc/mmtk/**'
      - 'runtime/**'
  workflow_dispatch:

jobs:
  correctness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends build-essential

      - name: Rust toolchain (for the MMTk staticlib)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo + mmtk staticlib
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            gc/mmtk/target
          key: ${{ runner.os }}-clbg-cargo-${{ hashFiles('gc/mmtk/Cargo.lock') }}

      - name: Configure
        run: ./configure

      # Build under MarkSweep (non-moving): never triggers the moving-GC bug, and
      # the `world` + `opt` targets never build the manpages — so we sidestep the
      # open moving-GC ocamldoc crash (ROADMAP bug #2) that breaks `world.opt`.
      # `world` = bytecode system; `opt` = native compiler + native stdlib (needed
      # to build/link native benchmarks). setarch -R disables ASLR (the MMTk
      # fixed-address metadata mmap flake) — required for every MMTk process.
      - name: Build bytecode world (MarkSweep)
        run: |
          setarch "$(uname -m)" -R env MMTK_PLAN=MarkSweep MMTK_HEAP_SIZE_MB=2048 \
            make -j"$(nproc)" world

      - name: Build native compiler + libs (MarkSweep)
        run: |
          setarch "$(uname -m)" -R env MMTK_PLAN=MarkSweep MMTK_HEAP_SIZE_MB=2048 \
            make -j"$(nproc)" opt

      # Build both bytecode and native benchmarks. The in-tree ./ocamlc and
      # ./ocamlopt are bytecode images with a runtime shebang that doesn't resolve
      # here, so drive them through ocamlrun. setarch -R guards the per-file
      # compiler invocations against the mmap flake.
      - name: Build CLBG benchmarks (bytecode + native)
        working-directory: benchmarks/clbg
        run: |
          setarch "$(uname -m)" -R env MMTK_PLAN=MarkSweep make all \
            OCAMLC="$GITHUB_WORKSPACE/runtime/ocamlrun $GITHUB_WORKSPACE/ocamlc" \
            OCAMLOPT="$GITHUB_WORKSPACE/runtime/ocamlrun $GITHUB_WORKSPACE/ocamlopt"

      # validate runs bytecode under all 5 plans and, now that build/*.native
      # exist, native under Immix + StickyImmix automatically.
      - name: Validate correctness across all plans
        working-directory: benchmarks/clbg
        env:
          MMTK_HEAP_SIZE_MB: 2048
          CLBG_TIMEOUT: 180
        run: ./run.sh validate
