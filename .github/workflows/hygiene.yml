name: Hygiene
on:
  push:
    branches:
      - '4.**'
      - '5.**'
      - 'trunk'
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

# Restrict the GITHUB_TOKEN
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - name: GitHub Context
        run: echo $GITHUB_CONTEXT
        env:
          GITHUB_CONTEXT: ${{ toJson(github) }}
        # Comment out the line below to enable (debugging) display of the github
        # context variable.
        if: failure()

      - uses: actions/checkout@v5
        with:
          fetch-depth: 50
          persist-credentials: false

      - name: Changes updated
        run: >-
          tools/ci/actions/check-changes-modified.sh
          '${{ github.event.pull_request.issue_url }}'
          '${{ github.ref }}'
          'pull_request'
          '${{ github.event.pull_request.base.ref }}'
          '${{ github.event.pull_request.base.sha }}'
          '${{ github.event.pull_request.head.ref }}'
          '${{ github.event.pull_request.head.sha }}'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        if: github.event_name == 'pull_request'

      # The fork pins autoconf 2.72 (see CLAUDE.md); ubuntu-latest ships 2.71, so
      # build 2.72 from the GNU mirror (fast -- autoconf is m4/perl only). Without
      # this, check-configure.sh's regeneration uses 2.71 and always differs from
      # the committed 2.72-generated configure.
      - name: Install autoconf 2.72
        run: |
          curl -sL https://ftp.gnu.org/gnu/autoconf/autoconf-2.72.tar.gz | tar xz
          (cd autoconf-2.72 && ./configure --prefix=/usr/local >/dev/null \
             && make >/dev/null && sudo make install >/dev/null)
          rm -rf autoconf-2.72
          autoconf --version | head -1

      - name: configure correctly generated
        run: >-
          tools/ci/actions/check-configure.sh
          '${{ github.ref }}'
          '${{ github.event_name }}'
          '${{ github.event.pull_request.base.ref }}'
          '${{ github.event.pull_request.base.sha }}'
          '${{ github.event.pull_request.head.ref }}'
          '${{ github.event.pull_request.head.sha }}'
          '${{ github.event.ref }}'
          '${{ github.event.before }}'
          '${{ github.event.ref }}'
          '${{ github.event.after }}'
        if: ${{ always() }}

      - name: Check that no ignored files have been committed
        run: tools/ci/actions/check-no-ignored-files.sh
        if: ${{ always() }}

      - name: check-typo revered
        id: revered
        run: >-
          tools/ci/actions/check-typo.sh
          '${{ github.ref }}'
          '${{ github.event_name }}'
          '${{ github.event.pull_request.base.ref }}'
          '${{ github.event.pull_request.base.sha }}'
          '${{ github.event.pull_request.head.ref }}'
          '${{ github.event.pull_request.head.sha }}'
          '${{ github.event.ref }}'
          '${{ github.event.before }}'
          '${{ github.event.ref }}'
          '${{ github.event.after }}'
        if: ${{ always() }}

      - name: check-typo on whole tree
        run: tools/check-typo
        # Upstream runs the whole-tree check on pushes to its pristine release
        # branches (trunk / 4.x / 5.x). This fork's mainline is `5.5+mmtk`, which
        # matches `refs/heads/5.` — so that trigger fired a whole-tree scan on every
        # push and flooded on pre-existing *upstream* test-file non-ASCII plus our
        # MMTk source/config additions. Scope to the diff-based `revered` check (the
        # normal per-PR gate); run the whole-tree check only when check-typo itself
        # signals it is needed (e.g. when the typo tooling/exceptions change).
        if: >-
          steps.revered.outputs.full_check_needed == 'true'
          && always()

      - name: Check that labelled/unlabelled .mli files are in sync
        run: tools/ci/actions/check-labelled-interfaces.sh
        if: always()

        # This step records the build success in the variable build-status,
        # allowing the last two steps to skip, rather than go beserk with a
        # faulty compiler.
      - name: Build a minimal compiler for alldepend
        id: compiler
        run: tools/ci/actions/runner.sh basic-compiler
        if: always()

      - name: Check that dependency info is up-to-date
        run: tools/ci/actions/check-alldepend.sh
        if: steps.compiler.outputs.build-status == 'success' && always()

      - name: Check global structure of the reference manual
        run: |
          # Required configuration info is left-over from the previous step
          make -C manual/tests check-stdlib check-case-collision
        if: steps.compiler.outputs.build-status == 'success' && always()
