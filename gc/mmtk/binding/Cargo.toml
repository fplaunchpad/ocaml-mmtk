[package]
name    = "mmtk-ocaml"
version = "0.1.0"
edition = "2021"

[lib]
name = "mmtk_ocaml"
# staticlib: links into the patched OCaml 5.x runtime (libmmtk_ocaml.a)
# rlib:      allows unit tests within this crate
crate-type = ["staticlib", "rlib"]

[dependencies]
mmtk              = { workspace = true }
mmtk-ocaml-common = { path = "../common" }
lazy_static       = { workspace = true }
libc              = { workspace = true }

# RQ8 (ocaml-mmtk): allocation-time zero-fill is a RUNTIME toggle now
# (`memory_manager::set_alloc_zeroed`, exposed as `mmtk_ocaml_set_alloc_zeroed`),
# not a cargo feature — runtime/mmtk.c sets it from the active plan so one binary
# disables zeroing for stop-the-world plans and keeps it on for ConcurrentImmix.
