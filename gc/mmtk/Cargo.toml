# In-tree MMTk binding for the OCaml 5.x fork.
#
# This is a self-contained Cargo workspace living inside the OCaml compiler
# tree (the OCaml tree itself is not a Cargo project). The `binding` crate
# builds a staticlib (`libmmtk_ocaml.a`) that is linked into the patched
# OCaml runtime; `common` holds the version-independent value-layout code.
#
# mmtk-core: version "0.32" is redirected (via [patch.crates-io] below) to our
# fork at `gc/mmtk-core` (git submodule -> fplaunchpad/mmtk-core, branch
# `0.32-ocaml`, our deltas on top of the v0.32.0 release tag). The fork is needed
# because the research plans modify mmtk-core itself (RQ8 no-zero allocation;
# later the GenConcurrentImmix plan). The submodule SHA pins the exact source.
[workspace]
members = ["common", "binding"]
resolver = "2"

[workspace.dependencies]
mmtk        = { version = "0.32", features = ["object_pinning", "sticky_immix_non_moving_nursery", "marksweep_as_nonmoving"] }
lazy_static = "1.5"
libc        = "0.2"

# Redirect the crates.io `mmtk` to our in-tree fork (the gc/mmtk-core submodule).
# Path is relative to this file (gc/mmtk/) -> gc/mmtk-core. The fork is v0.32.0 +
# our deltas, so the "0.32" version constraint above still resolves.
[patch.crates-io]
mmtk = { path = "../mmtk-core" }

[profile.release]
# Bring-up: keep debug info in the release staticlib for easier gdb/lldb work.
debug = true
